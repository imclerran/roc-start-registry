name: publish
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out gh-pages if it exists
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch origin gh-pages && git worktree add site origin/gh-pages
          else
            mkdir site && git -C site init -b gh-pages
          fi
      - run: python3 -m scripts.generate --out site --unresolved unresolved.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and push when changed
        run: |
          cd site
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -m "Publish $(date -u +%FT%TZ)"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Unresolved multi-bundle releases"
          num=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -s unresolved.txt ]; then
            { printf 'These releases ship several bundles the registry cannot identify, so they are not listed yet. Add rows to `bundles.csv` or ask upstream to prefix the bundle filenames with the variant name.\n\n'; sed 's/^/- /' unresolved.txt; } > issue-body.md
            if [ -n "$num" ]; then gh issue edit "$num" --body-file issue-body.md; else gh issue create --title "$title" --body-file issue-body.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Every multi-bundle release is now identified."
          fi
